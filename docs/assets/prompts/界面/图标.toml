name = "界面图标"
note = """
小程序界面里的道具与状态图标。不分皮肤——这些图标长在 UI 框架里（页面底 #121816、
按钮底 #1d2824、头像底 #202b27），而 UI 配色是固定的深绿，不随身份牌皮肤变。

最小使用尺寸是 .seat-badge 的 17 逻辑点（@3x = 51 物理像素），
.rider-fire 更小，只有 14 点（@3x = 42 物理像素）。
所以公共段里那几条「轮廓封闭、明暗只分大色块、不要细碎结构」不是风格偏好，
是 42 像素下还认得出的硬条件。
"""

# 公共段只管画风、构图、明暗结构、底色——形象和气质写进各图标自己的 desc。
# （见手册 4.2：公共段写气质会把所有图标抹平成一种）
style = """
游戏界面用的道具图标，单一物体悬浮在空中。\
造型厚实凝聚有体积感，轮廓封闭简洁，没有细碎的附属结构。\
明暗只分三层大色块，层与层之间边界清晰，不用连续渐变。\
主体位于画面正中，高度约占画面三分之二，四周留出均匀的背景。\
"""

tail = """
背景是纯净均匀的近黑色（接近 #0a0d0c），铺满整个画面，四边完全出血。\
严禁出现：底座、托盘、圆形边框、外框、手、地面、桌面、\
任何环境或背景物体、投影、文字、水印、白色边框、白色四角。\
"""

[icons.fireball]
label = "魔法指示物·火球"
size = "1920x1920"
desc = """
一团悬浮的魔法火球。主体是一个偏球形的火焰核心，顶部延伸出一到两条向上的火舌，\
整体有明确的上下朝向。中心是亮黄近白的芯，中层是饱和的橙色，外缘收进暗红。\
火焰凝聚成一颗有分量的实心球，而不是稀薄摇曳的火苗。\
"""

[icons.crown]
label = "队长·皇冠"
size = "1920x1920"
desc = """
一顶正面平视的金色王冠。冠体是一圈厚实的金属环带，上沿五个尖峰，中间那个最高，\
峰与峰之间的凹口开得很深，让上沿呈现明确的锯齿轮廓。环带正中镶一颗较大的深红宝石。\
造型端正左右对称。金属分三层：受光面亮金，主体中金，背光面暗金褐。\
"""

[icons.amulet]
label = "查验权·护身符"
size = "1920x1920"
desc = """
一枚悬挂的护身符吊坠。主体是一枚厚实的金色金属圆盘，边缘一圈规整的齿状装饰，\
盘心镶一颗饱满的蓝色宝石，宝石中央是一道竖直的瞳孔状纹样，像一只睁开的眼睛。\
圆盘正上方连着一个明显的挂环，挂环让整体轮廓不再是一个正圆。不画链子或绳子。\
金属分三层：受光面亮金，主体中金，背光面暗金褐；宝石从通透的中蓝过渡到深蓝。\
"""

# 破损版必须和完好版同角度同构图，而两条不同的提示词画不出同一枚吊坠（手册 4.7）。
# 所以这条要等 amulet 定稿后，拿定稿那张当参考图（REF=，手册 3.3）再跑，
# 不能和 amulet 一起跑。prompt 里「与完好版同一枚」这种话只在有参考图时才成立。
[icons.amulet_faded]
label = "查验权已用·破损护身符"
size = "1920x1920"
needs_ref = "amulet"
desc = """
与参考图里那枚护身符同一枚吊坠，同一个角度、同一个构图、同样的圆盘轮廓与挂环位置，\
但金属整体褪成暗淡的灰色，失去光泽不再反光；盘心的宝石已经碎裂成几块，\
裂纹从中心向外扩散，边上缺了一小块；圆盘边缘的齿状装饰有磕碰缺口。\
金属分三层：受光面浅灰，主体中灰，背光面深灰。\
"""

# 桌心纹章。原计划烤进桌面图里，但长桌的长宽比是 30 种连续变化的
# （tableLayout.js:81，宽高各自随该方向人数走），烤进去会被 cover 裁切拉扯，
# 所以保持 .table-emblem 独立居中节点，单独出图。116rpx = 58pt = 174px @3x。
[icons.table_emblem]
label = "桌心·圣杯纹章"
size = "1920x1920"
desc = """
一枚烫金的圆形纹章。外圈是一道完整的金属圆环，环上有规律排列的凸起铆钉；\
环内正中是一只造型简洁的高脚圣杯，杯身有一道竖直的高光。\
构图完全左右对称。金属分三层：受光面亮金，主体中金，背光面暗金褐。\
"""
