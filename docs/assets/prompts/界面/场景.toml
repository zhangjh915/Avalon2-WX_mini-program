[scenes.floor]
label = "牌桌台面·石板地面"
size = "1920x1920"
desc = """
一片浅灰米色石板地面的正俯视图，视线垂直向下。\
方形石板整齐铺设，石缝是很淡的细线，石面有细腻的颗粒质感和极轻微的深浅色斑。\
整体色调接近 #d8d4ca，像一块被经年磨平的旧石地，安静、朴素。\
