name = "界面场景"
note = """
垫在界面下面的材质与底纹。全部是「一整片连续材质」而不是「一张有主体的画」，
因为它们要被 background-size: cover 铺进尺寸会变的容器里。

桌面为什么只出材质不出整张桌子：.long-table 的长宽比由 tableLayout.js 按每边
人数算，归并 90° 旋转后仍有 30 种，从 1.00 连续排到 2.43。按配置各画一张不现实，
整张桌子图又会被拉伸变形。改成「CSS 出形状与桌沿 + 图出材质」，
长宽比变化只改变裁切，永远不会变形。
"""

style = """
质感写实但克制，均匀漫射光，不追求戏剧性打光，没有明确的光源方向。\
四边完全出血，材质延伸到画面之外，看不到任何边界。\
"""

tail = """
明暗对比很弱，整体明度均匀——这是要垫在界面底层、上面还要压文字和按钮的底。\
严禁出现：透视、倾斜视角、人物、手、椅子、餐具、蜡烛、书本、任何道具或摆件、\
文字、水印、白色边框、白色四角、相框、画框、投影、暗角。\
"""

[scenes.table_round]
label = "圆桌·桌面材质"
size = "1920x1920"
desc = """
一块中世纪深色橡木圆桌桌面的正俯视图，视线垂直向下。\
木板以画面正中为圆心呈放射状拼接，由中心向四周辐射，板缝是均匀的深色细线。\
木料是温润的深棕（接近 #4f3323），木纹清晰但不喧闹，表面哑光，有轻微的使用痕迹。\
桌面铺满整个画面，看不到桌沿、地面或桌子以外的任何东西。\
"""

