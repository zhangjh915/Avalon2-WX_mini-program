# 第一版绒毯实机不成立，两条原因：
# 1. 花纹一块 63 逻辑点，而圆桌直径 165 点——一块花纹是桌子的 38%，
#    整个台面横向只排得下 5 个。这个尺度不是「地面材质」，是「一面有图案的墙」。
#    所以这一版把花纹密度写成**可验证的具体数字**（横向十四个重复单元），
#    而不是「细密」这种模糊词——模糊词模型自己拿捏，拿捏出来的就是上一版。
# 2. 地毯明度和桌子几乎一样，两者糊在一起。这版写死「比中调木头暗一档以上」。
#
# 还有一条不是地毯的问题：.round-table 原本的 box-shadow 被误删了，
# 两个都是正俯视平光，没有投影就完全没有深度线索。见接线说明 §3.1。

[scenes.floor_carpet_green]
label = "绒毯·墨绿"
size = "1920x1920"
desc = """
一整块厚实羊毛绒毯的正俯视图，视线垂直向下。绒面浓密，能看出细密的绒毛走向。\
毯面上织着一层重复的暗花纹样，**横向排得下大约十四个重复单元**，每一个都很小。\
花纹只靠织法产生的明暗差呈现，和底色的明度差极小，要凑近看才分辨得出，远看就是一片有质感的素色绒面。\
整块毯子明度偏暗，比中调的木头颜色暗一档以上。\
画面上每一处花纹的大小都完全一致，没有近大远小。\
毯子铺满整个画面，四边完全出血，看不到毯边、地面或毯子以外的任何东西。\
底色是低饱和的深墨绿（接近 #1e2b26），暗花是同色系略深的一档。\
"""

