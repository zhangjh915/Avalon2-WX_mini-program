name = "界面场景"
note = """
垫在界面下面的材质与底纹。全部是「一整片连续材质」而不是「一张有主体的画」，
因为它们要被 background-size: cover 铺进尺寸会变的容器里。

圆桌 .round-table 固定 330x330rpx，不参与尺寸变化，所以整张出图，想画多华丽都行。

长桌 .long-table 的长宽比由 tableLayout.js:79-82 按每边人数算——宽只看上下边人数、
高只看左右边人数，两个参数独立，所以是笛卡尔积：6 个宽 x 6 个高，实际可达 30 种，
比值从 1.00 连排到 2.43（再乘 stage 自身 1.19 的宽高比，真实像素比是 1.19-2.89）。

底纹类（floor / home_bg）的「四边完全出血」必须写在各自的 desc 里：
公共段不能写，因为桌子恰恰需要留出近黑边给抠图用。
漏掉这句，home_bg 会被画成「白底上躺着一张纸」，四周一圈白边。

公共段里也**不要解释这张图将来会被什么盖住**。写过一句
「座位标记、任务牌和文字都要压在这张图上面」，模型直接在地面和羊皮纸上
画满了带数字的纸牌——肯定句式的提及，比同一段里的必禁清单强得多。

长桌因此生成**一张带完整桌沿的整图**，再用 Python 切九宫格：
四角固定像素、四边只沿单轴平铺、中心 cover。任何一块都只在单一方向上变化，不会变形。
边条要**镜像拼贴**成两倍宽再 repeat——生成图的边缘不可能天然无缝，
镜像后的图块按构造必然无缝。

中心纹章不烤进桌面，用独立居中的 .table-emblem（固定 116rpx）：
烤进去的话 cover 会让它随桌子大小浮动，极端比例还会被裁掉。
"""

style = """
正俯视图，视线垂直向下，完全没有透视。质感写实但克制，\
均匀漫射光，没有明确的光源方向，不追求戏剧性打光。\
"""

tail = """
整体明度均匀，明暗对比很弱，是一张安静的底。\
严禁出现：透视、倾斜视角、人物、手、椅子、餐具、蜡烛、书本、任何道具或摆件、\
文字、水印、白色边框、白色四角、相框、画框、投影、暗角。\
"""

