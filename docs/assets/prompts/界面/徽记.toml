# ---- 队徽第三轮：动物骨架 + 内部纹饰 ----
# 第二轮手绘平涂的画法通过了，但图腾选择暴露了一条硬约束：
#   102px 下只有狮子活下来。鹰蛇龙都靠细长结构表意（翼羽、蛇身、犄角獠牙），
#   细长外凸结构在 34pt 下必然粘连消失；狮子靠的是紧凑团块 + 放射轮廓。
# 所以这轮固定两条规则：
#   1. 外轮廓必须是紧凑团块，轮廓外没有细长突出物
#   2. 纹饰全部放在轮廓内部——内部细节会优雅降级成色块，外凸细节会变成噪点
# 四个方向探索「动物提供骨架、纹饰填充内部」的不同组合方式。

