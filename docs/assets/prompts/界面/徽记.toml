name = "界面徽记组图"
note = """
一张画布上排 4 枚圆形徽记，生成后用 scripts/split-sprites.py 按连通域切开。

为什么这么干：这批全是 34-72pt 的小圆形徽记，各出各的要 24 张 ¥14.40，
拼版只要 6 张 ¥3.60。1920x1920 放 2x2 每枚约 900px，
而最大用到的胜负印是 72pt @3x = 216px，余量 4 倍。

额外好处是**同一张画布里的一组天然一致**——光照、材质、比例、外环粗细全同源。
mission-orb 那四个状态必须是一套，分开抽卡凑出来的不算一套（手册 4.7）。

手册 3.2 记过 5pro 会把「一组 N 张」拼进同一张画布并带白色外框——
那次是坑，这次正是要的，但白框仍要在必禁清单里堵死。

切图靠连通域而不是按格子等分：模型不会把四枚摆得严丝合缝，
按格子切会切到边。所以徽记之间必须留出足够的近黑背景，这条写进了 style。
"""

