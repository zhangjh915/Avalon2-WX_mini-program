# ---- 阵营队徽 ----
# 一份资产两处用：任务指示器的成功/失败圆面（34pt）和结算页胜负印（72pt）。
# 所以队徽本身**不带底色**——那两处的绿/红由界面提供（.mission-orb 的圆面、
# .good-verdict / .evil-verdict 的渐变），队徽抠出来直接叠上去。
#
# 不匹配身份牌皮肤：身份牌有多套皮肤且玩家建房时选定，而队徽长在 UI 框架里不随皮肤变，
# 匹配了木刻就会和幻想华服打架。匹配的是已定稿的 UI 图标语言——黄铜、烫金剪影。
#
# 三套方向各出一张，选定方向后再加抽卡。

