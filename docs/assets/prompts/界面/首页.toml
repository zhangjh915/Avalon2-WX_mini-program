name = "首页背景"
note = """
首页整屏背景。这是第三版——前两版都被否了：
  v1 羊皮纸  → 「像纸做的一样」
  v2 浅橡木  → 「木纹很丑，还不如纯色呢」
所以这一版**放弃木纹**，方向是「安静」。

代码那边同期已经上了一版纯 CSS 渐变（fb923eb，home-bg.jpg 整张下线走 CSS），
这三版是产品主要求另出的对照，最终二选一。注意它走云存储，
首屏要先调云函数签名再下载——比 CSS 版慢一拍，这是它要赢的地方得赢得够多。

单独开文件而不是塞进 场景.toml，因为那边公共段写死了
「正俯视图，视线垂直向下，完全没有透视」——那是给桌面和地毯用的，
首页这几版恰恰要有纵深。手册 4.10：公共段只能放全体都成立的约束。

**安全区**（index.wxml 实际布局）：
  顶部 0~22%    标题 + 徽记压住
  中部 30~72%   昵称输入框和两个入口压住
  露出来的是 22~30% 这一条、底部 72~100%、以及左右边缘
所以**关键造型放底部四分之一**，中间必须是平坦的空白。

但**不能写「中间要留空给输入框」**——手册 4.9：肯定句式的提及比必禁清单强得多，
写了它就会在那儿画个框。要正向描述成「是一片平坦均匀的浅米白，没有任何图案」。

「四边完全出血」必须写进每条 desc，漏掉就会被画成「白底上躺着一张纸」，
四周一圈白边。这个坑 v1 踩过。
"""

