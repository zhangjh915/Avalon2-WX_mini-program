name = "泥金细密画"
note = "中世纪泥金手抄本细密画。金箔装饰边框收窄为四周约六分之一，人物占画面高度一半以上（B2 尺寸，已经用户确认）。平涂、无透视、无立体光影。"

style = """
中世纪泥金手抄本细密画风格，金箔装饰边框收窄为画面四周约六分之一的一圈，\
边框内是藤蔓卷草与花体纹样，金箔有真实的贴金质感与细微的压印痕。\
人物在画面中央，占画面高度二分之一以上，以深色墨线勾勒轮廓，\
色块平涂，没有立体光影也没有透视，衣褶用线条表示而非明暗。\
"""

tail = """
完全平面：没有阴影、没有渐变、没有景深。颜料是朱红、靛蓝、铅白、金四色为主。\
人物姿态端正，正面或四分之三侧面，像经书插图里的人物像。\
四边完全出血，画面没有任何留白。\
严禁出现：文字、水印、白色边框、白色四角、相框、画框、卡片投影、写实光影。\
"""

