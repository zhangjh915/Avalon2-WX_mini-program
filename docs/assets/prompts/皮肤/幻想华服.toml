name = "幻想华服"
note = "原神/崩铁式的幻想游戏立绘。人物年轻俊美，鲜明发色，服装是幻想化的华丽设计而非写实中世纪，动态姿势，光效点缀。"

style = """
日式幻想游戏角色立绘，干净利落的线稿配通透的渐变上色，发丝与布料有细致高光，\
少量魔法光效粒子，色彩明快通透。半身像，人物占画面高度三分之二以上，动态姿势有张力。\
距画面边缘约百分之三处一道纤细的金色装饰边框，边框有卷草转角。\
"""

tail = """
人物年轻俊美，头身比接近写实，五官精致但不夸张变形。\
四边完全出血，画面没有任何留白。\
严禁出现：文字、水印、白色边框、白色四角、相框、画框、卡片投影。\
"""

[background]
good = "背景是深靛蓝色调的虚化魔法光晕（接近 #1a2b38），冷调通透，不抢人物。"
evil = "背景是暗酒红色调的虚化魔法光晕（接近 #2e1518），暖调压抑，不抢人物。"

[characters]
arthur = "金发碧眼的年轻国王，蓝金相间的幻想铠甲，胸甲有发光的金色纹路，深蓝披风内衬绣着流动的金色符文，头戴造型锐利的金冠。手握一柄装饰华丽的长剑斜举，姿态挺拔有英气。"
percival = "蓝银短发的少年骑士，轻盈的幻想板甲配及膝长披风，双手将未出鞘的细剑抱在胸前，眉头微蹙，眼神警惕而诚恳。"
priest = "银白长发的祭司，白金法袍层层叠叠，衣摆浮着发光的经文，掌心托着一簇悬浮的金色烛焰。神情温和而洞悉一切。"
loyal = "褐发短须的青年骑士，灰蓝板甲胸前嵌着圆桌纹章形状的宝石，一手握剑一手扶盾，笑容爽朗直率。"
duke = "墨绿长发束在脑后的贵族青年，深绿丝绒外袍缀着金链，一手虚扶腰间的细剑，眼神从容里藏着锋芒。"
archduke = "灰紫长发的年长贵族，厚重毛领大氅缀满紫水晶，手持一柄家族权杖，眼神越过众人看向远处。"
squire = "赤褐短发的青年扈从，简化的轻甲，怀里抱着一顶带羽饰的头盔，神情恭谨但眼里有光。"
apprentice = "浅青色双马尾的少女学徒，米色长袍配青色围巾，身前浮着一卷自动翻页的发光书卷，眼神好奇专注。"
troublemaker = "土黄卷发的少年，衣着松垮口袋很多，指间飞快转着一枚发光的金币，一边嘴角上扬坏笑。"
galahad = "纯白长发的圣骑士，白金罩袍上有金十字，双手捧着一只透出圣光的圣杯，面容澄澈几乎不带阴影。"
reluctant = "灰褐乱发的青年，被硬套上一件明显过大的指挥官披风，一手扶额一手按剑，神情无奈但站得笔直。"
guard = "铁灰短发的魁梧卫兵，厚重的幻想板甲，双手拄着一柄长戟，目光警觉地扫视侧方。"
lancelotGood = "银白长发的骑士，银蓝铠甲泛着圣洁微光，手按剑柄，神情磊落坦荡，四分之三侧面。"

morgan = "银紫色长发的女术士，暗红与黑金的幻想法袍，肩部有夸张的金属肩饰，腰间垂着链饰与流苏，衣摆有发光的暗红纹路。指尖托着一团跳动的暗红魔法火焰，火焰化作细碎光粒向上飘散。姿态张扬自信，一手叉腰，眼神凌厉带笑。"
minion = "暗紫兜帽下只露出半张脸的青年，斗篷缀着发光的紫色纹路，神情顺从阴沉，视线躲闪不看正前方。"
shapeshifter = "青灰长发的人形，身体轮廓边缘泛起细碎扭曲的光粒，手中一面古旧铜镜映出的却是另一张脸。妖异，是一种让人不安的美。"
crownPrince = "金褐卷发的俊美王子，酒红与金边的华服，身姿挺拔贵气逼人，手中把玩着一顶尚未戴上的王冠，指尖摩挲冠沿，眼底藏着算计。"
