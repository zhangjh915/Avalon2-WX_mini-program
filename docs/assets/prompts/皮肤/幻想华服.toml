revealer = "暗红长发的人，高举一盏喷薄出光芒的提灯，光从下方照亮面部。神情坦然近乎从容，像早就知道自己会被看见。"
lunatic = "灰黄乱发的青年，衣衫松垮凌乱，双臂张开仰头大笑，周身飘着失控的暗红光屑。"
deceiver = "深青短发的俊秀廷臣，衣着考究华贵，笑意得体让人第一眼就想相信他。半边脸在暖光里、半边沉入阴影，眼神平静得看不出底细。"
boaster = "亮铜色卷发的骑士，铠甲擦得锃亮镶满勋章却毫无战损，挺胸抬头，表情浮夸自信虚张声势。"
saboteur = "铁锈色短发的老兵，卸去半副铠甲，肩头还留着领袖绶带压出的旧痕，低头擦拭一把不再出鞘的剑，神情平静。"
outsider = "灰褐长发的人，斗篷拉得很紧只露出半张脸，神情疏离警觉，像随时准备离开。"
lancelotEvil = "与正义的兰斯洛特同一张脸、同一姿态、同一构图、同样英挺，但银发染上墨色，铠甲泛暗红微光，神情阴郁。四分之三侧面。"

# 一局里能出现多次的角色（gameCore.js 的 roleLimits）：
#   loyal / minion 不限（10 人局最多 6 个忠臣、3 个爪牙）
#   duke / archduke / priest / apprentice 各最多 2
# 有变体的角色不再出「通用版」，直接出各变体。
#
# ⚠️ variants 段必须放在 [back] 之前。放在 [back.motifs] 后面的话，
# 任何按 "[back.motifs]" 截断重写纹样的脚本都会把它一起删掉（已经踩过一次）。
