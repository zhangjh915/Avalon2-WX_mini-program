name = "木刻线刻"
note = "中世纪单色套印木刻版画。黑白排线塑造体积，全卡只有一种套色，套色就是阵营色——正义靛蓝、邪恶暗红。套色铺在人物最大的一块布料上（披风/罩袍/大氅），保证面积够大、一眼看得见。"

style = """
中世纪木刻版画风格，以粗细不一的排线与交叉排线塑造体积与阴影，\
线条有木刻特有的顿挫感与毛边，纸面是米白色并有轻微的印刷不均。\
半身像，人物占画面高度三分之二以上，位于画面中上部，构图端正。\
距画面边缘约百分之三处一道粗黑线边框。\
"""

tail = """
这是单色套印版画：除黑白排线外，整幅只出现一种彩色，且集中在指定的那一大块上，\
面积要足够大、位置要显眼，不能是零碎的小点。其余一切都是纯黑白。\
形体概括有力，不追求写实细节。\
四边完全出血，画面没有任何留白。\
严禁出现：文字、水印、白色边框、白色四角、相框、画框、卡片投影、第二种彩色、彩色渐变。\
"""

# 阵营靠两件事同时区分：套色的颜色，以及背景排线的方向。
# 上一版把阵营区分只交给排线方向（平行 vs 交叉），太微妙，等于没有；
# 套色又按角色各配一种，蓝绿红黄都有，反而把阵营辨识彻底搞乱了。
[background]
good = "本卡的套色是靛蓝色，整幅画除黑白排线外只出现靛蓝这一种颜色。背景以整齐的水平横向排线压暗，横线均匀平行，越靠近画面边缘越密。"
evil = "本卡的套色是暗红色，整幅画除黑白排线外只出现暗红这一种颜色。背景以整齐的垂直竖向排线压暗，竖线均匀平行，越靠近画面边缘越密。"

