name = "平涂海报"
note = "现代插画海报。粗细一致的干净线条 + 大面积纯色平涂，几乎没有渐变和阴影，形体高度概括，靠剪影和色块辨认角色。"

style = """
现代插画海报风格，粗细一致的干净线条，大面积纯色平涂，几乎没有渐变、阴影和材质细节，\
形体高度概括，配色对比强烈。半身像，人物占画面高度三分之二以上，\
姿态简洁有标志性，剪影清晰可辨。距画面边缘约百分之三处一道纯色细边框。\
"""

tail = """
每个人物由三到四块主要色块构成，五官只用极少的线条勾出。\
不要渐变，不要写实材质，不要复杂光影。\
四边完全出血，画面没有任何留白。\
严禁出现：文字、水印、白色边框、白色四角、相框、画框、卡片投影。\
"""

# 平涂风格没有虚化背景，背景就是一整块纯色
